<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Summarizer Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <section class="chat">
        <header class="chat-header">
          <div>
            <p>OpenAI Agents SDK</p>
            <h1>Email Summarizer</h1>
          </div>
          <span>gpt-4o-mini</span>
        </header>

        <section id="messages" class="messages">
          <div class="empty">
            <h2>Paste or upload a long email</h2>
            <p>The agent will summarize it into quick bullet points and action items.</p>
          </div>
        </section>

        <p id="error" class="error" hidden></p>

        <form id="summarizeForm" class="composer">
          <textarea
            id="emailInput"
            name="email"
            placeholder="Paste your email here..."
            rows="6"
          ></textarea>

          <div class="actions">
            <label class="file-label">
              <input id="emailFile" name="emailFile" type="file" accept=".txt,.eml,.md" />
              <span id="fileName">Upload email file</span>
            </label>

            <button id="submitButton" type="submit">Summarize</button>
          </div>
        </form>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
